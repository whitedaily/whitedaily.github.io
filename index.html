<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>测试页面</title><style>body{font-family:Arial;text-align:center;padding:50px;background:#f0f0f0}h1{color:#333}p{color:#666;margin:20px 0}</style></head>
<body>
<h1>✅ 测试页面</h1>
<p>当前时间: <span id="time"></span></p>
<p>User Agent: <span id="ua"></span></p>
<p>如果看到这行字，说明 GitHub Pages 可以正常提供服务。</p>
<script>document.getElementById('time').textContent=new Date().toLocaleString();document.getElementById('ua').textContent=navigator.userAgent;</script>
</body>
</html>
